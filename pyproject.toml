[project]
name = "vscode-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
vscode-python = "vscode_python:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
